<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kontaktní formulář</title>
<style>
    /* Základní stylování stránky */
    body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f9;
        margin: 0;
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    /* Kontejner pro formulář */
    .contact-container {
        background: #ffffff;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 500px;
    }

    h2 {
        margin-top: 0;
        color: #333333;
        text-align: center;
    }

    /* Stylování jednotlivých prvků formuláře */
    .form-group {
        margin-bottom: 20px;
    }

    label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
        color: #555555;
    }

    input[type="email"],
    textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid #cccccc;
        border-radius: 4px;
        box-sizing: border-box;
        font-size: 16px;
    }

    input[type="email"]:focus,
    textarea:focus {
        border-color: #007BFF;
        outline: none;
        box-shadow: 0 0 5px rgba(0, 123, 255, 0.3);
    }

    /* Velké textové pole */
    textarea {
        resize: vertical;
        min-height: 150px;
    }

    /* Tlačítko odeslání */
    button[type="submit"] {
        background-color: #007BFF;
        color: white;
        border: none;
        padding: 12px 20px;
        font-size: 16px;
        border-radius: 4px;
        cursor: pointer;
        width: 100%;
        transition: background-color 0.2s;
    }

    button[type="submit"]:hover {
        background-color: #0056b3;
    }
</style>
</head>
<body>

<div class="contact-container">
    <h2>Napište nám</h2>
    <form action="#" method="POST">
        
        <div class="form-group">
            <label for="email">Váš email:</label>
            <input type="email" id="email" name="email" placeholder="vas@email.cz" required>
        </div>

        <div class="form-group">
            <label for="message">Zpráva:</label>
            <textarea id="message" name="message" placeholder="Napište svůj text sem..." required></br>
        </div>

        <button type="submit">Odeslat zprávu</button>

    </form>
</div>
</body>
