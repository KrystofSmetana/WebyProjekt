</head>


<body class="bg-light">
    <nav class="navbar navbar-expand-lg bg-dark" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Brm Brm</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarColor02"
                aria-controls="navbarColor02" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarColor02">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="NapisteNam.html">Napište nám</a>

                        <a class="nav-link" href="MultiCulti.html">Formulář</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body p-4">
                        <h2 class="text-center mb-4">Multi Select Formulář</h2>

                        <form id="contactForm" action="odeslat.php" method="POST">

                            <!-- E-mailová adresa -->
                            <div class="mb-3">
                                <label for="email" class="form-label">Vaše e-mailová adresa</label>
                                <input type="email" class="form-control" id="email" name="email"
                                    placeholder="jmeno@example.cz" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Vyberte možnosti (zvolte alespoň jednu):</label>
                                <div class="border p-3 rounded bg-white">

                                    <div class="form-check">
                                        <input class="form-check-input option-checkbox" type="checkbox" name="vyber[]"
                                            value="volba1" id="volba1">
                                        <label class="form-check-label" for="volba1">
                                            První možnost
                                        </label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input option-checkbox" type="checkbox" name="vyber[]"
                                            value="volba2" id="volba2">
                                        <label class="form-check-label" for="volba2">
                                            Druhá možnost
                                        </label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input option-checkbox" type="checkbox" name="vyber[]"
                                            value="volba3" id="volba3">
                                        <label class="form-check-label" for="volba3">
                                            Třetí možnost
                                        </label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input option-checkbox" type="checkbox" name="vyber[]"
                                            value="volba4" id="volba4">
                                        <label class="form-check-label" for="volba4">
                                            Čtvrtá možnost
                                        </label>
                                    </div>

                                </div>
                                <div id="checkboxError" class="text-danger mt-1"
                                    style="display: none; font-size: 0.875em;">
                                    Vyberte prosím alespoň jednu možnost.
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="zprava" class="form-label">Vaše zpráva</label>
                                <textarea class="form-control" id="zprava" name="zprava" rows="5"
                                    placeholder="Sem napište svůj text..." required></textarea>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg">Odeslat zprávu</button>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('contactForm').addEventListener('submit', function (event) {

            const checkboxes = document.querySelectorAll('.option-checkbox');
            const checkedCount = Array.from(checkboxes).filter(cb => cb.checked).length;
            const errorDiv = document.getElementById('checkboxError');


            if (checkedCount === 0) {
                event.preventDefault();
                errorDiv.style.display = 'block';
            } else {
                errorDiv.style.display = 'none';
            }
        });
    </script>
</body>
