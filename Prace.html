<!DOCTYPE html>
<html lang="cs">

<head>
    <title>Multi Select</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="node_modules/bootswatch/dist/solar/bootstrap.min.css">
</head>


<body class="bg-light">
    <nav class="navbar navbar-expand-lg bg-dark" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Luxury Autos</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarColor02"
                aria-controls="navbarColor02" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarColor02">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="index.html">Nabýdka</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="MateZajem.html">Máte zájem?</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="Prace.html">Nabíráme</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body p-4">
                        <h2 class="text-center mb-4">Pracovní Formulář</h2>

                        <form id="contactForm" action="odeslat.php" method="POST">


                            <div class="mb-3">
                                <label class="form-label">Vaše Jméno</label>
                                <input class="form-control" placeholder="např... Karel Novák" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Jaké jazyky ovládáte (zvolte alespoň jednu):</label>


                                <select id="zanry" name="zanry[]" class="form-select" multiple required>
                                    <!-- Neodeslatelná a zakázaná výchozí volba -->
                                    <option value="" disabled selected>vyberte...</option>
                                    <option value="C">Češtinu</option>
                                    <option value="S">Slovenštinu</option>
                                    <option value="A">Angličtinu</option>
                                    <option value="D">Němčinu</option>
                                    <option value="R">Ruštinu</option>
                                    <option value="J">Japonštinu</option>
                                </select>

                                <div id="checkboxError" class="text-danger mt-1"
                                    style="display: none; font-size: 0.875em;">
                                    Vyberte prosím alespoň jednu možnost.
                                </div>
                            </div>
                            <div class="form-text">Pro výběr více položek podržte klávesu Ctrl (nebo Cmd na Macu).</div>

                            <div class="mb-3">
                                <label for="zprava" class="form-label">Co můžete nabýdnout naší firmě?</label>
                                <textarea class="form-control" id="zprava" name="zprava" rows="5"
                                    placeholder="Sem napište své důvody..." required></textarea>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg">Odeslat formulář</button>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
